# Render Blueprint: creates all three services on the free plan from this one file.
# Database: use Neon (free, pgvector, no expiry) and paste its URL when Render asks for DATABASE_URL.
services:
  # --- API (FastAPI) ---
  - type: web
    name: marketplace-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL          # postgresql+psycopg://...  (Neon string, with the +psycopg part)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: EMBEDDING_DIM
        value: "768"
      - key: CELERY_EAGER          # run background tasks inline: no worker/Redis on the free plan
        value: "true"
      - key: CORS_ORIGINS          # JSON list of the two frontend URLs, e.g. ["https://a.onrender.com","https://b.onrender.com"]
        sync: false

  # --- Storefront (customers + sellers) ---
  - type: web
    name: marketplace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL     # https://<api-host>.onrender.com/api/v1
        sync: false
      - key: VITE_ADMIN_URL        # https://<admin-host>.onrender.com
        sync: false

  # --- Admin console (same code, admin-only build) ---
  - type: web
    name: marketplace-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:admin
    staticPublishPath: dist-admin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
